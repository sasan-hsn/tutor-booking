services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor_booking_db
    environment:
      POSTGRES_DB: tutor_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
