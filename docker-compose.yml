services:
  postgres:
    image: postgres:16-alpine
    container_name: tutor_booking_db
    environment:
      POSTGRES_DB: tutor_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tutor_booking_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
