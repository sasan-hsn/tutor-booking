{% extends "dashboard_base.html" %}

{% block page_content %}
<h2 class="mb-3">Upcoming Lessons</h2>

<div class="lessons-row">
    <div class="lessons-actions">
        <a href="{% url 'booking:student_booking' %}" class="btn-minimal">
            <i class="bi bi-plus-lg"></i> Book Now
        </a>
        <a href="{% url 'booking:student_calendar' %}" class="btn-minimal">
            <i class="bi bi-calendar3"></i> Calendar
        </a>
    </div>

    {% include 'partials/_lesson_cards.html' %}
</div>

<div class="past-lessons-section">
    <h2 class="mb-3">Past Lessons <i class="bi bi-clock-history text-muted"></i></h2>
    <div class="lessons-row">
        {% include 'partials/_past_lesson_cards.html' %}
    </div>
</div>

<div class="modal fade" id="lessonDetailModal" data-url="{% url 'booking:lesson_detail_student' booking_id=0 %}"
    tabindex="-1" aria-labelledby="lessonDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="lessonDetailModalLabel">Lesson Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="lessonDetailModalBody">
            </div>
        </div>
    </div>
</div>

{% endblock %}
