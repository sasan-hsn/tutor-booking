{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="container max-w-5xl px-4 py-5">
    <h1>Log In</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit" class="btn-login fw-bold">Log In</button>
    </form>
</div>
{% endblock %}
