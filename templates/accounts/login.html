{% extends "landing_base.html" %}

{% block title %}Log In{% endblock %}

{% block page_content %}
<div class="container max-w-5xl px-4 py-5">
    <div class="glass-card p-4 mx-auto" style="max-width: 420px;">
        <h1 class="mb-4">Log In</h1>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'' }}">

            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-accent w-100 mt-2">Log In</button>
        </form>

        <p class="text-muted text-center mt-4 mb-0">
            Don't have an account? <a href="{% url 'accounts:student_signup' %}" class="text-primary-brand fw-bold">Sign
                up</a>
        </p>
    </div>
</div>
{% endblock %}
