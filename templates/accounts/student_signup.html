{% extends "landing_base.html" %}

{% block title %}Sign Up{% endblock %}

{% block page_content %}
<div class="container max-w-5xl px-4 py-5">
    <h1>Sign Up</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-login fw-bold">Sign Up</button>
    </form>
</div>
{% endblock %}
