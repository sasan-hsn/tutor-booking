{% extends "landing_base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block page_content %}
<div class="container max-w-5xl px-4 py-5">
    <div class="glass-card p-4 mx-auto text-center" style="max-width: 440px;">
        <h1 class="h3 mb-3">Password Reset Complete</h1>
        <p class="text-muted mb-4">
            Your password has been successfully set. You can now log in using your new password.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn-accent d-block w-100">Log In</a>
    </div>
</div>
{% endblock %}
