{% load avatar_tags %}

{% if upcoming_bookings %}
<div class="lesson-cards-wrapper">
    <button type="button" class="scroll-arrow scroll-arrow-left" aria-label="Scroll left">
        <i class="bi bi-chevron-left"></i>
    </button>
    <div class="lesson-cards-scroll" id="lessonCardsScroll" data-section="upcoming" data-ajax-url="{% if user.teacher_profile %}{% url 'booking:teacher_dashboard' %}{% else %}{% url 'booking:student_dashboard' %}{% endif %}">
        {% include 'partials/_lesson_card_items.html' %}
        {% if upcoming_has_next %}
        <div class="carousel-sentinel" data-section="upcoming" data-next-page="2"></div>
        {% endif %}
    </div>
    <button type="button" class="scroll-arrow scroll-arrow-right" aria-label="Scroll right">
        <i class="bi bi-chevron-right"></i>
    </button>
</div>
{% else %}
<div class="empty-state flex-grow-1">
    <p>You don't have any upcoming lessons.</p>
</div>
{% endif %}
