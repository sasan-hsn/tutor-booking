{% if profile_picture %}
<img src="{{ profile_picture }}" alt="{{ display_name }}'s avatar" class="rounded-circle"
    style="width: {{ size }}px; height: {{ size }}px; object-fit: cover;">
{% else %}
<div class="rounded-circle d-flex align-items-center justify-content-center text-white"
    style="width: {{ size }}px; height: {{ size }}px; background-color: {{ color }}; font-weight: 600;"
    role="img" aria-label="{{ display_name }}'s avatar">
    {{ initial }}
</div>
{% endif %}
