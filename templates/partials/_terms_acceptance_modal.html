<div class="modal fade" id="termsAcceptanceModal" tabindex="-1" aria-labelledby="termsAcceptanceModalLabel"
    aria-hidden="true" data-accept-url="{% url 'accounts:accept_terms' %}"
    data-terms-version="{{ terms_version }}">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="termsAcceptanceModalLabel">Terms of Service &amp; Financial Policy</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted mb-2">
                    Please review and accept Version {{ terms_version }} before continuing with bookings, wallet top-ups, or payout requests.
                </p>
                <div class="terms-scroll-body border rounded p-3 mb-3 bg-light" id="termsDocumentBody">
                    {{ terms_html }}
                </div>
                <div id="termsAcceptanceErrorAlert" class="alert alert-danger d-none mb-3" role="alert"></div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="acceptTermsCheckbox">
                    <label class="form-check-label" for="acceptTermsCheckbox">
                        I have read, understood, and accept the Terms of Service and Financial Policy (Version {{ terms_version }}).
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-minimal" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn-accent" id="acceptTermsContinueBtn" disabled>Accept &amp; Continue</button>
            </div>
        </div>
    </div>
</div>
